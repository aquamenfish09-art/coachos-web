<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoachOS</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080b12;
      color: white;
    }

    .app-header {
      padding: 18px 16px;
      background: linear-gradient(135deg, #22c55e, #38bdf8);
      color: #06131e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .app-title {
      font-size: 23px;
      font-weight: 900;
    }

    #languageSelect {
      width: auto;
      min-width: 130px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.4);
      background: #020617;
      color: white;
      font-weight: 800;
    }

    nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px;
      background: #0f172a;
      position: sticky;
      top: 0;
      z-index: 10;
    }
